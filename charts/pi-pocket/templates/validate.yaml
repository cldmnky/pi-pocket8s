{{- if not (has .Values.portal.authMode (list "auto" "token" "github")) -}}
{{- fail "portal.authMode must be auto, token or github" -}}
{{- end -}}
{{- if include "pocket.githubEnabled" . -}}
{{- if or (not .Values.portal.enabled) (not .Values.ingress.enabled) (eq (include "pocket.portalNamespace" .) .Release.Namespace) -}}
{{- fail "GitHub mode requires an enabled HTTPS portal in a separate management namespace" -}}
{{- end -}}
{{- range $key := list "appID" "clientID" "installationID" "organization" "existingSecret" -}}
{{- if empty (index $.Values.portal.github $key) -}}{{- fail (printf "portal.github.%s is required" $key) -}}{{- end -}}
{{- end -}}
{{- if not (regexMatch "^[a-zA-Z0-9][a-zA-Z0-9-]*$" .Values.portal.github.organization) -}}{{- fail "invalid GitHub organization" -}}{{- end -}}
{{- $installations := dict -}}
{{- $installationOwners := dict (toString .Values.portal.github.installationID) (lower .Values.portal.github.organization) -}}
{{- if not (kindIs "map" .Values.portal.github.repositoryInstallations) -}}{{- fail "portal.github.repositoryInstallations must map account names to installation IDs" -}}{{- end -}}
{{- if gt (len .Values.portal.github.repositoryInstallations) 500 -}}{{- fail "select at most 500 repository installations" -}}{{- end -}}
{{- range $owner, $id := .Values.portal.github.repositoryInstallations -}}
{{- if or (not (regexMatch "^[a-zA-Z0-9][a-zA-Z0-9-]*$" $owner)) (not (regexMatch "^[1-9][0-9]*$" (toString $id))) (le (int64 $id) 0) -}}{{- fail "repository installations must map account names to positive installation IDs" -}}{{- end -}}
{{- $owner = lower $owner -}}
{{- if hasKey $installations $owner -}}{{- fail "duplicate GitHub repository owner" -}}{{- end -}}
{{- $idKey := toString (int64 $id) -}}
{{- if and (hasKey $installationOwners $idKey) (ne (get $installationOwners $idKey) $owner) -}}{{- fail "GitHub installation cannot belong to multiple owners" -}}{{- end -}}
{{- if and (eq $owner (lower $.Values.portal.github.organization)) (ne $idKey (toString $.Values.portal.github.installationID)) -}}{{- fail "organization repositories must use the membership installation" -}}{{- end -}}
{{- $_ := set $installations $owner (int64 $id) -}}
{{- $_ := set $installationOwners $idKey $owner -}}
{{- end -}}
{{- end -}}
{{- if not (has (int .Values.replicas) (list 0 1)) -}}
{{- fail "replicas must be 0 or 1: pi-pocket uses a single-writer SQLite database" -}}
{{- end -}}
{{- if and .Values.openshift.enabled (not (has .Values.openshift.pocketSCC (list "restricted-v3" "nested-container"))) -}}
{{- fail "openshift.pocketSCC must be restricted-v3 or nested-container" -}}
{{- end -}}
{{- if and .Values.ingress.enabled (empty .Values.ingress.pocketHost) -}}
{{- fail "ingress.pocketHost is required" -}}
{{- end -}}
{{- if and .Values.portal.enabled .Values.ingress.enabled (empty .Values.ingress.portalHost) -}}
{{- fail "ingress.portalHost is required when portal is enabled" -}}
{{- end -}}
{{- if and .Values.ingress.enabled (empty .Values.ingress.terminalHost) -}}
{{- fail "ingress.terminalHost is required" -}}
{{- end -}}
{{- if and .Values.portal.enabled (not .Values.ingress.enabled) -}}
{{- fail "the portal requires an HTTPS ingress and explicit origin" -}}
{{- end -}}
{{- if not (has .Values.serviceAccount.namespaceRole (list "admin" "edit" "view" "")) -}}
{{- fail "serviceAccount.namespaceRole must be admin, edit, view, or empty" -}}
{{- end -}}
