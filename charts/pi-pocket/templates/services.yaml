apiVersion: v1
kind: Service
metadata:
  name: {{ include "pocket.fullname" . }}
  labels:
    {{- include "pocket.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pocket
  ports:
    - name: http
      port: 8787
      targetPort: http
{{- if .Values.portal.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pocket.fullname" . }}-portal
  labels:
    {{- include "pocket.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: portal
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
