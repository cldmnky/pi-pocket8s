{{- if not .Values.runtimeSecret.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pocket.runtimeSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pocket.runtimeSecret" . }}
  labels:
    {{- include "pocket.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  {{- toYaml $existing.data | nindent 2 }}
  {{- else }}
  api-keys.json: {{ "{}" | b64enc | quote }}
  authorized_keys: ""
  known_hosts: ""
  {{- end }}
{{- end }}
{{- if and .Values.portal.enabled (not .Values.portal.tokenSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pocket.tokenSecret" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pocket.tokenSecret" . }}
  labels:
    {{- include "pocket.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ if and $existing $existing.data }}{{ index $existing.data "token" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- end }}
