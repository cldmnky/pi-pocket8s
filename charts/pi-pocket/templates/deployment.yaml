apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pocket.fullname" . }}
  labels:
    {{- include "pocket.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pocket
  template:
    metadata:
      labels:
        {{- include "pocket.labels" . | nindent 8 }}
        app.kubernetes.io/component: pocket
      {{- if .Values.openshift.enabled }}
      annotations:
        openshift.io/required-scc: {{ .Values.openshift.pocketSCC | quote }}
      {{- end }}
    spec:
      hostUsers: false
      serviceAccountName: {{ include "pocket.fullname" . }}
      automountServiceAccountToken: true
      # A Service named pi-pocket would otherwise inject
      # PI_POCKET_PORT=tcp://... over the image's numeric port.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: {{ include "pocket.seccomp" . }}
      containers:
        - name: pocket
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
          securityContext:
            {{- if and .Values.openshift.enabled (eq .Values.openshift.pocketSCC "nested-container") }}
            allowPrivilegeEscalation: true
            procMount: Unmasked
            capabilities:
              drop: [ALL]
              add: [SETUID, SETGID]
            {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            {{- end }}
          env:
            - name: HOME
              value: /workspace/home
            - name: PI_POCKET_DIR
              value: /workspace/home/.pi-pocket
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: runtime-config
              mountPath: /run/pocket-config
              readOnly: true
            - name: runtime
              mountPath: /run/user/1000
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "pocket.claim" . }}
        - name: runtime-config
          secret:
            secretName: {{ include "pocket.runtimeSecret" . }}
            defaultMode: 0440
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
