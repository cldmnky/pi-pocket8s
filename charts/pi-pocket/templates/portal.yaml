{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pocket.fullname" . }}-portal
  namespace: {{ include "pocket.portalNamespace" . }}
  labels:
    {{- include "pocket.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Sessions are deliberately in memory. Recreate avoids two independent
  # session stores during upgrades and asks operators to sign in again.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: portal
  template:
    metadata:
      labels:
        {{- include "pocket.labels" . | nindent 8 }}
        app.kubernetes.io/component: portal
      {{- if .Values.openshift.enabled }}
      annotations:
        openshift.io/required-scc: restricted-v3
      {{- end }}
    spec:
      hostUsers: false
      serviceAccountName: {{ include "pocket.fullname" . }}-portal
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: portal
          image: "{{ .Values.portal.image.repository }}:{{ .Values.portal.image.tag }}"
          imagePullPolicy: {{ .Values.portal.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            - name: POCKET_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PORTAL_AUTH_MODE
              value: {{ .Values.portal.authMode | quote }}
            {{- if include "pocket.githubEnabled" . }}
            - name: POCKET_SERVICE_ACCOUNT
              value: {{ include "pocket.fullname" . }}
            - name: GITHUB_APP_ID
              value: {{ .Values.portal.github.appID | quote }}
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.portal.github.clientID | quote }}
            - name: GITHUB_INSTALLATION_ID
              value: {{ .Values.portal.github.installationID | quote }}
            - name: GITHUB_ORGANIZATION
              value: {{ .Values.portal.github.organization | quote }}
            - name: GITHUB_TEAM
              value: {{ .Values.portal.github.team | quote }}
            - name: GITHUB_REPOSITORY_POLICY_SECRET
              value: {{ printf "%s-github-repositories" (include "pocket.fullname" .) | quote }}
            - name: GITHUB_REPOSITORY_INSTALLATIONS
              {{- $installations := dict }}
              {{- range $owner, $id := .Values.portal.github.repositoryInstallations }}
              {{- $_ := set $installations (lower $owner) (int64 $id) }}
              {{- end }}
              value: {{ toJson $installations | quote }}
            {{- end }}
            - name: POCKET_DEPLOYMENT
              value: {{ include "pocket.fullname" . }}
            - name: CONFIG_SECRET
              value: {{ include "pocket.runtimeSecret" . }}
            - name: PORTAL_TOKEN_FILE
              value: /run/portal/token
            - name: PORTAL_ORIGIN
              value: {{ printf "https://%s" .Values.ingress.portalHost | quote }}
            - name: POCKET_URL
              value: {{ printf "https://%s" .Values.ingress.pocketHost | quote }}
            - name: TERMINAL_URL
              value: {{ printf "https://%s" .Values.ingress.terminalHost | quote }}
            {{- if .Values.adminElevation.enabled }}
            {{- $operators := list }}
            {{- range .Values.adminElevation.operators }}{{- $operators = append $operators (toString .) }}{{- end }}
            # Admin API configuration. The portal authenticates operators and
            # records session requests; the controller owns the binding and the
            # admin Deployment. No ADMIN_BOOTSTRAP, reconcile or health value is
            # exposed here, so the portal can never provision the delegation.
            - name: ADMIN_NAMESPACE
              value: {{ .Values.adminElevation.namespace | quote }}
            - name: ADMIN_DEPLOYMENT
              value: {{ .Values.adminElevation.deployment | quote }}
            - name: ADMIN_SERVICE_ACCOUNT
              value: {{ .Values.adminElevation.serviceAccount | quote }}
            - name: ADMIN_RUNTIME_SECRET
              value: {{ .Values.adminElevation.runtimeSecret | quote }}
            - name: ADMIN_POCKET_URL
              value: {{ .Values.adminElevation.pocketURL | quote }}
            - name: ADMIN_TERMINAL_URL
              value: {{ .Values.adminElevation.terminalURL | quote }}
            - name: ADMIN_SESSION_SECRET
              value: {{ include "pocket.adminSessionSecret" . | quote }}
            - name: ADMIN_CLUSTER_ROLE_BINDING
              value: {{ include "pocket.adminClusterRoleBinding" . | quote }}
            - name: ADMIN_CLUSTER_ROLE
              value: {{ .Values.adminElevation.clusterRole | quote }}
            - name: ADMIN_OPERATORS
              value: {{ join "," $operators | quote }}
            - name: ADMIN_DEFAULT_DURATION_SECONDS
              value: {{ .Values.adminElevation.defaultDurationSeconds | quote }}
            - name: ADMIN_MAX_DURATION_SECONDS
              value: {{ .Values.adminElevation.maxDurationSeconds | quote }}
            - name: ADMIN_RECENT_LOGIN_SECONDS
              value: {{ .Values.adminElevation.recentLoginSeconds | quote }}
            - name: ADMIN_STARTUP_TIMEOUT_SECONDS
              value: {{ .Values.adminElevation.startupTimeoutSeconds | quote }}
            {{- end }}
          volumeMounts:
            {{- if include "pocket.githubEnabled" . }}
            - name: github-app
              mountPath: /run/github-app
              readOnly: true
            {{- else }}
            - name: token
              mountPath: /run/portal
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
      volumes:
        {{- if include "pocket.githubEnabled" . }}
        - name: github-app
          secret:
            secretName: {{ .Values.portal.github.existingSecret }}
            defaultMode: 0440
        {{- else }}
        - name: token
          secret:
            secretName: {{ include "pocket.tokenSecret" . }}
            defaultMode: 0440
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
