apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pocket.fullname" . }}
  labels:
    {{- include "pocket.labels" . | nindent 4 }}
{{- if .Values.serviceAccount.namespaceRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pocket.fullname" . }}-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccount.namespaceRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pocket.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.openshift.enabled .Values.openshift.bindSCC }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pocket.fullname" . }}-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.openshift.pocketSCC }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pocket.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.portal.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pocket.fullname" . }}-portal
  namespace: {{ include "pocket.portalNamespace" . }}
  labels:
    {{- include "pocket.labels" . | nindent 4 }}
---
# This Role remains in the WORKSPACE namespace. The management-namespace
# portal identity gets only the named Secret and named Deployment operations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pocket.fullname" . }}-portal
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "pocket.runtimeSecret" . | quote }}]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [{{ include "pocket.fullname" . | quote }}]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pocket.fullname" . }}-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pocket.fullname" . }}-portal
subjects:
  - kind: ServiceAccount
    name: {{ include "pocket.fullname" . }}-portal
    namespace: {{ include "pocket.portalNamespace" . }}
{{- if and .Values.openshift.enabled .Values.openshift.bindSCC }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pocket.fullname" . }}-portal-scc
  namespace: {{ include "pocket.portalNamespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:restricted-v3
subjects:
  - kind: ServiceAccount
    name: {{ include "pocket.fullname" . }}-portal
    namespace: {{ include "pocket.portalNamespace" . }}
{{- end }}
{{- if include "pocket.githubEnabled" . }}
---
# TokenReview is cluster-scoped, but grants no read/list access to any cluster
# resource and no ability to mint service-account tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "pocket.fullname" . }}-github-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "pocket.fullname" . }}-github-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "pocket.fullname" . }}-github-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "pocket.fullname" . }}-portal
    namespace: {{ include "pocket.portalNamespace" . }}
{{- end }}
{{- end }}
