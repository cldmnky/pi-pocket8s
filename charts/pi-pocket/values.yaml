nameOverride: ""
fullnameOverride: ""
# standard: the normal persistent namespace-admin workspace.
# admin: the isolated, stopped-by-default workspace that adminElevation starts
# and stops. It refuses to render unless replicas is 0, storage is ephemeral, it
# has no namespace role, no portal and no elevation controls of its own.
workspace:
  mode: standard # standard | admin
image:
  repository: quay.io/cldmnky/pi-pocket
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
# Exactly one process may open pocket.sqlite. Recreate avoids overlapping writers.
replicas: 1
openshift:
  enabled: true
  # nested-container permits rootless Podman inside the pod user namespace.
  # restricted-v3 removes those permissions (Podman execution then is limited).
  pocketSCC: nested-container
  bindSCC: true
# Override the pocket pod seccomp profile. Empty selects per-profile defaults:
# Unconfined for nested-container (nested user namespaces), RuntimeDefault for
# restricted-v3 (the only profile that SCC allows).
podSeccomp: ""
serviceAccount:
  # WARNING: steering the agent grants this namespace-level Kubernetes authority.
  namespaceRole: admin
persistence:
  # pvc keeps the workspace (home, repos, SQLite, logins) across restarts.
  # ephemeral mounts emptyDir per session, so every admin session starts with a
  # fresh home and identity and nothing survives a Pod replacement.
  mode: pvc # pvc | ephemeral
  existingClaim: ""
  size: 40Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  # Helm uninstall retains repositories, SQLite state, OAuth logins and caches.
  retain: true
runtimeSecret:
  existingSecret: ""
portal:
  enabled: true
  # GitHub mode REQUIRES a different, pre-created management namespace.
  # Empty keeps the existing single-namespace token-auth installation.
  namespace: ""
  authMode: auto # GitHub when github.clientID is set; token otherwise
  github:
    appID: ""
    clientID: ""
    installationID: "" # organization installation used for login membership checks
    organization: "" # login gate, independent of additional repository owners
    team: "" # empty allows all active organization members
    # Repository permissions are selected in the portal, persisted in a retained
    # management-namespace Secret. Old `repositories` Helm values are ignored.
    # A fresh policy starts empty (denies all); only org owners can edit it.
    # Additional account owners (including personal accounts) -> installation IDs
    # of the SAME App. Empty preserves organization-only repository access.
    # Everyone who can steer the shared workspace can use these bot permissions.
    repositoryInstallations: {}
    existingSecret: "" # management namespace: client-secret + private-key.pem
    brokerCASecret: "" # optional workspace namespace Secret: ca.crt
  image:
    repository: quay.io/cldmnky/pi-pocket-portal
    tag: latest
    pullPolicy: Always
  tokenSecret: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {cpu: "4", memory: 8Gi}
ingress:
  enabled: true
  className: openshift-default
  pocketHost: ""
  portalHost: ""
  terminalHost: ""
  # On OpenShift, omission uses the router's default certificate.
  pocketTLSSecret: ""
  portalTLSSecret: ""
  terminalTLSSecret: ""
  annotations:
    route.openshift.io/termination: edge
    route.openshift.io/insecureEdgeTerminationPolicy: Redirect
    haproxy.router.openshift.io/timeout: 1h
networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      network.openshift.io/policy-group: ingress
nodeSelector: {}
tolerations: []
# Management-side cluster-admin elevation. Enabling it is a deliberate security
# decision: the portal exposes a named admin API and the lifecycle controller can
# bind cluster-admin to the separate admin workspace service account. Off by
# default, so existing installations render exactly as before.
adminElevation:
  # Requires workspace.mode=standard and portal.authMode=github; renders the
  # portal admin env vars and the lifecycle controller. The normal workspace
  # never receives these credentials.
  enabled: false
  # Explicit installer action: render the privileged controller RBAC and the
  # inert (subject-less) predefined cluster-admin binding. Never defaulted on.
  # The admin workspace cannot start a session while this is false.
  bootstrap: false
  # Target admin workspace, named by the separate stopped release. Each value
  # must differ from this release's namespace and from the portal namespace; the
  # controller treats them as fixed configuration, never request input.
  namespace: ""
  deployment: ""
  serviceAccount: ""
  # Admin runtime Secret: the controller clears owner-login metadata here and
  # the portal reads the freshness metadata through a named role in the admin
  # namespace.
  runtimeSecret: ""
  pocketURL: "" # https origin of the admin workspace (no trailing slash)
  terminalURL: "" # optional https origin of the admin terminal
  # Durable session-state Secret in the portal namespace. Defaults to
  # <fullname>-admin-session; retained across upgrades and uninstall.
  sessionSecret: ""
  # Exact ClusterRole the controller may bind and the roleRef of the inert
  # predefined binding. Changing it changes what a session grants.
  clusterRole: cluster-admin
  # Predefined inert binding the controller patches. Defaults to
  # <fullname>-admin-cluster-admin. A name collision with an unrelated object
  # must fail the session, never be adopted.
  clusterRoleBinding: ""
  # Numeric GitHub user IDs allowed to activate. Empty denies every activation.
  operators: []
  # Bounded session lifetime in seconds; default < max, both <= 3600.
  defaultDurationSeconds: 900
  maxDurationSeconds: 1800
  # Activation requires a portal login no older than this many seconds.
  recentLoginSeconds: 900
  # Upper bound on waiting for the admin workspace to become ready.
  startupTimeoutSeconds: 180
  # Controller reconciliation interval.
  reconcileSeconds: 5
