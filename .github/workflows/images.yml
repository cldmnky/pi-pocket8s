# Container images for Pi Pocket and its portal.
#
#   pull_request: build both architectures for both images, no push; the amd64
#                 pi-pocket image is smoke tested.
#   main/tags/manual/scheduled: same builds, pushed per architecture to
#                 quay.io/cldmnky/<image>, then merged into one manifest list
#                 tagged sha-<commit> (immutable) and, on main only, latest.
#
# Built with podman, the tool the Makefile and README use, and pulled only from
# registry.access.redhat.com and quay.io: Docker Hub's anonymous pull limits have
# failed whole runs (429/504 while resolving the Go build image), and nothing here
# needs it. The pi-pocket image pins the upstream commit in images/Containerfile;
# scheduled runs exist to pick up newer UBI 10 base images and RHEL packages.
#
# Each architecture builds on its own native runner (ubuntu-24.04-arm for arm64):
# no QEMU, no binfmt registration, and no emulated RUN steps.
#
# The buildx cache (type=gha) has no podman equivalent: podman on the runners has
# no GitHub cache backend, and a registry cache would mean pushing cache images
# from pull requests. Builds run from the base image each time.
name: images

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/**"
      - "extensions/**"
      - "images/**"
      - "portal/**"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/**"
      - "extensions/**"
      - "images/**"
      - "portal/**"
      - "Makefile"
    tags:
      - "*"
  schedule:
    - cron: "43 3 * * 1"
  # Publishing rules, whatever triggers a run: pull requests build and smoke-test
  # only, never push. Every other run publishes the two architecture images and the
  # multi-arch manifest under sha-<commit>. `latest` is written only from main, so a
  # dispatch on a branch publishes without moving what the chart deploys. A manual
  # run may add one readable alias beside the commit tag (input `tag`); `latest`
  # cannot be set that way.
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra tag for the published images (e.g. 0.25.0). Never latest."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: cldmnky

jobs:
  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pi-pocket
            containerfile: images/Containerfile
            context: .
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - image: pi-pocket
            containerfile: images/Containerfile
            context: .
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - image: pi-pocket-portal
            containerfile: portal/Containerfile
            context: portal
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - image: pi-pocket-portal
            containerfile: portal/Containerfile
            context: portal
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up podman
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          # Rootful podman: no subordinate-ID setup for the runner user, no
          # rootless networking, and the same trust the docker daemon had here.
          sudo podman version

      - name: Log in to Quay
        if: github.event_name != 'pull_request'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${QUAY_TOKEN}" | sudo podman login --username "${QUAY_USERNAME}" --password-stdin "${QUAY_REGISTRY}"

      - name: Build
        id: build
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tag="local/${{ matrix.image }}:pr"
          else
            tag="${QUAY_REGISTRY}/${QUAY_NAMESPACE}/${{ matrix.image }}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          sudo podman build --pull=always \
            --platform "${{ matrix.platform }}" \
            --file "${{ matrix.containerfile }}" \
            --tag "${tag}" \
            "${{ matrix.context }}"

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          sudo podman push --digestfile /tmp/digest "${{ steps.build.outputs.tag }}"
          echo "pushed ${{ steps.build.outputs.tag }} $(cat /tmp/digest)"

      - name: Smoke test the pi-pocket image
        if: github.event_name == 'pull_request' && matrix.image == 'pi-pocket' && matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          sudo podman volume rm -f smoke-home smoke-repos >/dev/null 2>&1 || true
          sudo podman run --detach --name smoke --publish 127.0.0.1:8787:8787 --publish 127.0.0.1:8081:8081 \
            --tmpfs /run/user/1000:rw,nosuid,nodev,mode=1777 \
            --env POCKET_FRAME_ANCESTORS=https://portal.example.com \
            --env TERMINAL_FRAME_ANCESTORS=https://portal.example.com \
            --volume smoke-home:/workspace/home \
            --volume smoke-repos:/workspace/repos \
            local/pi-pocket:pr

          ready=0
          status=""
          for _ in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/ || true)"
            if [ "${status}" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done

          sudo podman logs smoke || true
          if [ "${ready}" != "1" ]; then
            echo "::error::pi-pocket did not answer on :8787 (last status: ${status:-none})"
            exit 1
          fi

          # The entrypoint prepared the persistent workspace and skipped the
          # kubeconfig (no service account is mounted here).
          sudo podman exec smoke test -d /workspace/home/.pi
          sudo podman exec smoke test -d /workspace/home/.pi-pocket
          sudo podman exec smoke test -d /workspace/home/.ssh
          sudo podman exec smoke sh -c 'test ! -e /workspace/home/.kube/config'

          # The entrypoint seeds the shipped Pi skill and /agent-browser prompt
          # template into the workspace home (copy-if-missing).
          sudo podman exec smoke test -f /workspace/home/.pi/agent/skills/agent-browser/SKILL.md
          sudo podman exec smoke test -f /workspace/home/.pi/agent/prompts/agent-browser.md

          # The read-only Kubernetes MCP server, and the MCP server list the entrypoint seeds beside that
          # skill. Nothing starts the server: MCP support comes from a gallery extension this image does not
          # ship, so it stays inert until the owner installs that extension and switches the kubernetes server
          # on. What is asserted is what the image ships — the pinned binary, its root-owned read-only TOML,
          # and the entry that names both — plus the seed line in the log below.
          sudo podman exec smoke test -x /usr/local/bin/kubernetes-mcp-server
          sudo podman exec smoke kubernetes-mcp-server --version | grep -qx 'v0.1.1'
          sudo podman exec smoke test -f /usr/share/pi-agent/mcp/kubernetes-read-only.toml
          sudo podman exec smoke grep -qx 'read_only = true' /usr/share/pi-agent/mcp/kubernetes-read-only.toml
          sudo podman exec smoke grep -qx 'toolsets = \["core"\]' /usr/share/pi-agent/mcp/kubernetes-read-only.toml
          sudo podman exec smoke grep -qx 'kind = "Secret"' /usr/share/pi-agent/mcp/kubernetes-read-only.toml
          sudo podman exec smoke test -f /workspace/home/.pi/agent/mcp.json
          sudo podman exec smoke jq -e '
            .mcpServers.kubernetes
            | .command == "/usr/local/bin/kubernetes-mcp-server"
              and .args == ["--config", "/usr/share/pi-agent/mcp/kubernetes-read-only.toml"]
              and (.description | type == "string" and length > 0)' \
            /workspace/home/.pi/agent/mcp.json >/dev/null

          # Nested-container Podman support: vfs storage, a subuid/subgid range inside
          # the pod's outer 65536-uid mapping, and setuid/filecap helper binaries.
          sudo podman exec smoke sh -c 'grep -q "driver = \"vfs\"" /etc/containers/storage.conf'
          sudo podman exec smoke sh -c 'grep -qx "pocket:10000:50000" /etc/subuid && grep -qx "pocket:10000:50000" /etc/subgid'
          sudo podman exec smoke sh -c 'getcap /usr/bin/newuidmap | grep -q cap_setuid && getcap /usr/bin/newgidmap | grep -q cap_setgid'

          # The owner sign-in token and its QR code must not reach the container log;
          # the token itself stays in config.json (never printed by this job). The
          # log is captured whole each time: piping into `grep -q` can kill `podman
          # logs` with SIGPIPE (141) under pipefail, and with an early match would
          # also make the leak check below a silent no-op.
          logs="$(sudo podman logs smoke 2>&1)"
          token="$(sudo podman exec smoke node -e 'const { ownerToken } = require("/workspace/home/.pi-pocket/config.json"); process.stdout.write(ownerToken)')"
          if [ -z "${token}" ]; then
            echo "::error::could not read the owner token from config.json"
            exit 1
          fi
          grep -qF 'seeded .pi/agent/mcp.json' <<<"${logs}" \
            || { echo "::error::the entrypoint did not seed ~/.pi/agent/mcp.json"; exit 1; }

          # The owner's allow-list for subagent models, with 0.25.0's meaning: an empty list lets a subagent run only
          # on its session's model, a nonempty one only on the models it lists — the session's own included. The
          # entrypoint seeds the shipped types' models through the app's API, which may answer 503 for a moment after
          # readiness, so poll both config.json and the log for 30 turns. The assertion still requires all three
          # models and all three grant lines.
          seeded=0
          for _ in $(seq 1 30); do
            logs="$(sudo podman logs smoke 2>&1)"
            if sudo podman exec smoke jq -e '(.subagentModels // []) as $allowed
                | ["opencode-go/mimo-v2.6-pro", "opencode-go/deepseek-v4.1-flash", "opencode-go/glm-5.3"]
                | map(. as $model | $allowed | index($model) != null) | all' \
                /workspace/home/.pi-pocket/config.json >/dev/null 2>&1 \
              && grep -qF 'allowed opencode-go/mimo-v2.6-pro for subagents' <<<"${logs}" \
              && grep -qF 'allowed opencode-go/deepseek-v4.1-flash for subagents' <<<"${logs}" \
              && grep -qF 'allowed opencode-go/glm-5.3 for subagents' <<<"${logs}"; then
              seeded=1
              break
            fi
            sleep 1
          done
          if [ "${seeded}" != "1" ]; then
            sudo podman exec smoke jq '.subagentModels // []' /workspace/home/.pi-pocket/config.json || true
            echo "::error::the entrypoint did not allow the shipped subagent models"
            exit 1
          fi

          # The subagent-model route the entrypoint seeds through, called directly, because the spawn path and the
          # seeding both depend on it: it needs a signed-in person (401 without the owner token), the app's own
          # header (403 without X-Pocket), a JSON body it can read (400), and granting a model that is already
          # allowed answers 200 with the whole list rather than growing it.
          seed_url="http://127.0.0.1:8787/api/subagent-models"
          seed_body='{"model":"opencode-go/glm-5.3","allowed":true}'
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H 'X-Pocket: 1' --data "${seed_body}" "${seed_url}" || true)"
          if [ "${status}" != "401" ]; then
            echo "::error::the subagent-model route is open without a sign-in (status ${status:-none})"
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' --data "${seed_body}" "${seed_url}" || true)"
          if [ "${status}" != "403" ]; then
            echo "::error::the subagent-model route answered ${status:-none} without the X-Pocket header, not 403"
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' -H 'X-Pocket: 1' --data '{' "${seed_url}" || true)"
          if [ "${status}" != "400" ]; then
            echo "::error::the subagent-model route answered ${status:-none} to a malformed body, not 400"
            exit 1
          fi
          for attempt in 1 2; do
            status="$(curl -sS -o /tmp/seed-grant.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' -H 'X-Pocket: 1' --data "${seed_body}" "${seed_url}" || true)"
            if [ "${status}" != "200" ]; then
              echo "::error::granting an allowed model answered ${status:-none} on attempt ${attempt}, not 200"
              exit 1
            fi
            if ! jq -e '.subagentModels | index("opencode-go/glm-5.3") != null' /tmp/seed-grant.json >/dev/null; then
              echo "::error::the grant answer does not carry the model in subagentModels"
              cat /tmp/seed-grant.json || true
              exit 1
            fi
          done

          # The two shipped modules as the running app itself reports them, through its owner API. The loader lists
          # what it discovered: both modules on, built-in, with no load error, each with what it installed.
          # `_agent-types-policy.ts` is a helper beside agent-types.ts and not a module, so the list must not have it.
          extensions_json="$(curl -sS -H "Authorization: Bearer ${token}" http://127.0.0.1:8787/api/extensions)"
          if ! jq -e '
            (.modules | map(.file)) as $files
            | [(.modules[] | select(.file == "web-search.ts"))] as $ws
            | [(.modules[] | select(.file == "agent-types.ts"))] as $at
            | ($files | index("_agent-types-policy.ts")) == null
              and ($ws | length) == 1 and $ws[0].source == "built-in" and $ws[0].enabled == true and ($ws[0].error == null)
              and ($at | length) == 1 and $at[0].source == "built-in" and $at[0].enabled == true and ($at[0].error == null)
              and ([$ws[0].extensions[] | select(.name == "pocket-web-search") | .tools[]] | sort)
                == ["web_fetch", "web_search", "web_search_config"]
              and ([$at[0].extensions[] | select(.name == "agent-types") | .wraps[]] | sort)
                == ["section subagents", "tool subagent"]
          ' <<<"${extensions_json}" >/dev/null; then
            echo "::error::the shipped extensions are not loaded as built-ins with their tools and wraps"
            jq '.modules | map({file, source, enabled, error, extensions})' <<<"${extensions_json}" || true
            exit 1
          fi

          if grep -qF "${token}" <<<"${logs}"; then
            echo "::error::the owner token leaked into the container log"
            exit 1
          fi
          grep -q '\[redacted\]' <<<"${logs}" || { echo "::error::the sign-in link was not redacted in the log"; exit 1; }
          grep -q 'QR code hidden' <<<"${logs}" || { echo "::error::the sign-in QR code was not hidden in the log"; exit 1; }

          # The portal-iframe embed patches applied to the pinned upstream sources.
          sudo podman exec smoke sh -c 'grep -qx "        .frame-ancestors .self. https://portal.example.com.," /opt/pi-pocket/src/server/http/assets.ts'
          sudo podman exec smoke sh -c '[ "$(grep -c SameSite=None /opt/pi-pocket/src/server/auth.ts)" = 2 ]'
          grep -q 'embedded mode enabled for https://portal.example.com' <<<"${logs}" || { echo "::error::the embed patch did not apply"; exit 1; }

          # Web terminal daemon: health check, auth gate, framing/CSP headers,
          # then a real PTY round-trip over WebSocket with the owner token.
          thealth="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/healthz || true)"
          if [ "${thealth}" != "200" ]; then
            echo "::error::terminal daemon did not answer on :8081 (status: ${thealth:-none})"
            exit 1
          fi
          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)" != "401" ]; then
            echo "::error::terminal page is not gated on the owner token"
            exit 1
          fi
          theaders="$(curl -sI http://127.0.0.1:8081/ || true)"
          grep -qi "frame-ancestors 'self' https://portal.example.com" <<<"${theaders}" || { echo "::error::terminal framing header missing"; exit 1; }
          grep -qi "wasm-unsafe-eval" <<<"${theaders}" || { echo "::error::terminal CSP cannot load the WASM parser"; exit 1; }
          # The prober lives in the repo so it is syntax-checked by CI too.
          cp "$GITHUB_WORKSPACE/images/term-smoke.mjs" /tmp/term-smoke.mjs
          SMOKE_TOKEN="${token}" node /tmp/term-smoke.mjs
          # The web_search extension the image ships as a Pi Pocket built-in: the module and its
          # vendored provider code are in place, it still installs its tool, and the running app
          # loaded it (a module that fails to load is reported in the log and left off).
          sudo podman exec smoke test -f /opt/pi-pocket/src/server/extensions/web-search/vendor/providers/openai.ts
          sudo podman exec --workdir /opt/pi-pocket smoke node --input-type=module -e '
            const { default: createWebSearch } = await import("/opt/pi-pocket/src/server/extensions/web-search.ts");
            const extension = createWebSearch({ notice() {} });
            if (extension.name !== "pocket-web-search") throw new Error("unexpected extension name: " + extension.name);
            if (extension.tools?.[0]?.name !== "web_search") throw new Error("the web_search tool was not installed");
            console.log("web-search extension ok");
          '
          if grep -qF 'web-search.ts failed to load' <<<"${logs}"; then
            echo "::error::the web-search extension failed to load in the running app"
            exit 1
          fi

          # The agent-types extension, and the subagent types it ships as data. The entrypoint
          # seeds them into the workspace home (copy-if-missing, above); the module must load and
          # install its tool and section wraps, and the running app must not have failed it.
          sudo podman exec smoke test -f /workspace/home/.pi/agent/agents/architect.md
          sudo podman exec smoke test -f /workspace/home/.pi/agent/agents/coder.md
          sudo podman exec smoke test -f /workspace/home/.pi/agent/agents/reviewer.md
          sudo podman exec smoke test -f /workspace/home/.pi/agent/agents/_readme.md
          sudo podman exec --workdir /opt/pi-pocket smoke node --input-type=module -e '
            const { default: createAgentTypes } = await import("/opt/pi-pocket/src/server/extensions/agent-types.ts");
            const extension = createAgentTypes({ notice() {}, agentDir: "/usr/share/pi-agent" });
            if (extension.name !== "agent-types") throw new Error("unexpected extension name: " + extension.name);
            if (extension.wraps?.length !== 2) throw new Error("the tool and section wraps were not installed");
            console.log("agent-types extension ok");
          '
          if grep -qF 'agent-types.ts failed to load' <<<"${logs}"; then
            echo "::error::the agent-types extension failed to load in the running app"
            exit 1
          fi

          # libsndfile: what audio tooling in the workspace links against (soundfile, sox front ends,
          # anything reading or writing WAV/FLAC/Ogg). Assert the shared library is present, not just
          # the package name.
          sudo podman exec smoke rpm -q libsndfile
          sudo podman exec smoke sh -c 'ldconfig -p | grep -q libsndfile'

          # The kimi-k3 strict-mode fix the image ships: the merge happens before the app starts, so
          # a workspace without it sends strict-mode tool schemas to a gateway that rejects them, and
          # every tool-using request to that model fails with HTTP 400. 0.25.0's Refresh models
          # re-reads the same seeded file.
          sudo podman exec smoke test -f /workspace/home/.pi/agent/models.json
          sudo podman exec smoke jq -e '.providers["opencode-go"].modelOverrides["kimi-k3"].compat.supportsStrictMode == false' /workspace/home/.pi/agent/models.json

          # The subagent machinery the pinned upstream ships: a failed subagent's run is delivered
          # as a report through the courier instead of leaving the parent waiting for good. Assert the
          # task is still in the source the image runs.
          sudo podman exec smoke grep -q 'pocket.subagent-courier' /opt/pi-pocket/src/server/extensions/subagents.ts

          # Node 24 with its built-in SQLite, plus the upstream runtime dependencies.
          sudo podman exec smoke node -e 'const { DatabaseSync } = require("node:sqlite"); new DatabaseSync(":memory:").exec("select 1"); console.log("node:sqlite ok")'
          sudo podman exec --workdir /opt/pi-pocket smoke node -e 'import("jiti").then(() => console.log("jiti ok"))'
          sudo podman exec smoke rg --version
          sudo podman exec smoke chromium --version
          sudo podman exec smoke agent-browser --version
          # agent-browser drives the bundled headless Chromium over CDP: open a
          # page in an isolated session, snapshot it, screenshot it, then close.
          # /run/user/1000 is the chart's emptyDir in-cluster; the smoke run
          # mounts an equivalent tmpfs so the daemon has a socket directory.
          sudo podman exec -e AGENT_BROWSER_SESSION=smoke smoke agent-browser open https://example.com | grep -q 'Example Domain'
          sudo podman exec -e AGENT_BROWSER_SESSION=smoke smoke agent-browser snapshot -i | grep -q 'Learn more'
          sudo podman exec -e AGENT_BROWSER_SESSION=smoke smoke agent-browser screenshot /tmp/agent-browser-smoke.png
          sudo podman exec smoke test -s /tmp/agent-browser-smoke.png
          sudo podman exec -e AGENT_BROWSER_SESSION=smoke smoke agent-browser close
          sudo podman exec smoke kubectl version --client
          sudo podman exec smoke helm version
          sudo podman exec smoke oc version --client

          # The toolchain the image adds beyond UBI's RPMs. Each pinned download must run, yq must
          # evaluate an expression rather than only print a version, and the two shell scripts plus
          # every workflow the repository ships must pass their own linters inside the image — the
          # last is why this job runs on workflow edits at all.
          sudo podman exec smoke yq --version
          sudo podman exec smoke sh -c 'printf "a: 1\n" | yq -e ".a == 1"'
          sudo podman exec smoke shellcheck --version
          sudo podman exec smoke shellcheck /usr/local/bin/pi-pocket-entrypoint /usr/local/bin/pi-pocket-embed-patch
          sudo podman exec smoke actionlint -version
          sudo podman cp .github/workflows smoke:/tmp/workflows
          # Both workflow extensions, so a *.yaml added later cannot escape the lint. find exits
          # non-zero when actionlint reports a finding; the guard catches an empty directory.
          sudo podman exec smoke sh -c 'test -n "$(ls /tmp/workflows/*.yml /tmp/workflows/*.yaml 2>/dev/null)"'
          sudo podman exec smoke find /tmp/workflows \( -name '*.yml' -o -name '*.yaml' \) -exec actionlint {} +
          sudo podman exec smoke sqlite3 :memory: 'select 1'
          sudo podman exec smoke ncat --version
          sudo podman exec smoke sh -c 'test -x /usr/bin/nc'
          sudo podman exec smoke socat -V
          sudo podman exec smoke fd --version
          sudo podman exec smoke bat --version
          sudo podman exec smoke delta --version
          sudo podman exec smoke uv --version
          sudo podman exec smoke uvx --version

          # The background tool 0.24 ships: a task runs in bash, its log is cut into segments with `split` (both
          # coreutils packages, but an image that trimmed them would only fail at the first long build), and the
          # server watches the task's processes through /proc.
          sudo podman exec smoke bash -c 'test -x "$(command -v bash)" && test -x "$(command -v split)"'
          sudo podman exec smoke test -r /proc/self/stat

          # A model the owner stops allowing stays stopped. The entrypoint records what it seeded in
          # .subagent-models-seeded and never grants a model again, so a restart on the same volumes must not put
          # the revoked one back. Revoke one seeded model, restart, and check the config, the marker, and that the
          # server came back.
          revoke_url="http://127.0.0.1:8787/api/subagent-models"
          status="$(curl -sS -o /tmp/revoke.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' -H 'X-Pocket: 1' \
            --data '{"model":"opencode-go/glm-5.3","allowed":false}' "${revoke_url}" || true)"
          if [ "${status}" != "200" ]; then
            echo "::error::revoking a seeded subagent model answered ${status:-none}, not 200"
            exit 1
          fi
          if ! sudo podman exec smoke jq -e '(.subagentModels // []) | index("opencode-go/glm-5.3") == null' \
              /workspace/home/.pi-pocket/config.json >/dev/null; then
            echo "::error::the revoked model is still in subagentModels before the restart"
            exit 1
          fi
          sudo podman exec smoke grep -qx 'opencode-go/glm-5.3' /workspace/home/.pi-pocket/.subagent-models-seeded \
            || { echo "::error::the seeding marker lost the revoked model, so a restart would grant it again"; exit 1; }

          sudo podman restart smoke >/dev/null
          ready=0
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/ || true)" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          sudo podman logs smoke || true
          if [ "${ready}" != "1" ]; then
            echo "::error::pi-pocket did not come back on :8787 after a restart"
            exit 1
          fi
          if ! sudo podman exec smoke jq -e '(.subagentModels // [])
              | (index("opencode-go/glm-5.3") == null)
                and (index("opencode-go/mimo-v2.6-pro") != null)
                and (index("opencode-go/deepseek-v4.1-flash") != null)' \
              /workspace/home/.pi-pocket/config.json >/dev/null; then
            sudo podman exec smoke jq '.subagentModels // []' /workspace/home/.pi-pocket/config.json || true
            echo "::error::the restart did not keep the revoked model revoked, or lost the other seeded ones"
            exit 1
          fi

      - name: Clean up the smoke container
        if: always() && github.event_name == 'pull_request' && matrix.image == 'pi-pocket' && matrix.platform == 'linux/amd64'
        run: |
          sudo podman rm -f smoke >/dev/null 2>&1 || true
          sudo podman volume rm -f smoke-home smoke-repos >/dev/null 2>&1 || true

  merge:
    name: merge ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - pi-pocket
          - pi-pocket-portal
    steps:
      - name: Set up podman
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo

      - name: Log in to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${QUAY_TOKEN}" | sudo podman login --username "${QUAY_USERNAME}" --password-stdin "${QUAY_REGISTRY}"

      - name: Create the multi-arch manifest
        env:
          IMAGE: ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.image }}
          # Passed through the environment, never interpolated into the script.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          refs=("docker://${IMAGE}:sha-${GITHUB_SHA}-amd64" "docker://${IMAGE}:sha-${GITHUB_SHA}-arm64")

          # Both per-architecture images are already in the registry. Build the index
          # from those references and push the index only (`--all=false`, and the
          # default is `--all`): pushing the images again would re-upload every layer
          # a second time. A missing architecture makes `manifest create` fail, so a
          # partial index cannot be published quietly.
          sudo podman manifest create "${IMAGE}:sha-${GITHUB_SHA}" "${refs[@]}"
          sudo podman manifest push --all=false "${IMAGE}:sha-${GITHUB_SHA}" "docker://${IMAGE}:sha-${GITHUB_SHA}"

          # A manual run may publish one readable alias beside the commit tag. It can
          # never write latest: that stays reserved for main, where it tracks the
          # merged image the chart deploys.
          if [ -n "${INPUT_TAG}" ]; then
            if [ "${INPUT_TAG}" = "latest" ] || ! [[ "${INPUT_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::refusing tag '${INPUT_TAG}': use letters, digits, _ . - and not latest"
              exit 1
            fi
            sudo podman manifest push --all=false "${IMAGE}:sha-${GITHUB_SHA}" "docker://${IMAGE}:${INPUT_TAG}"
            echo "published ${IMAGE}:${INPUT_TAG}"
          fi

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            sudo podman manifest push --all=false "${IMAGE}:sha-${GITHUB_SHA}" "docker://${IMAGE}:latest"
          fi

          # The published index must reference exactly the two images that were built.
          index="$(sudo skopeo inspect --raw "docker://${IMAGE}:sha-${GITHUB_SHA}")"
          for ref in "${refs[@]}"; do
            digest="$(sudo skopeo inspect --format '{{.Digest}}' "${ref}")"
            if ! grep -q "${digest#sha256:}" <<<"${index}"; then
              echo "::error::${IMAGE}:sha-${GITHUB_SHA} does not reference ${ref} (${digest})"
              exit 1
            fi
          done
          echo "${index}"
