name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: portal/go.mod
          cache-dependency-path: portal/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: pip install -r requirements-dev.txt
      - run: make lint test
      - run: test -z "$(gofmt -l $(find portal terminal -name '*.go'))"
